name: SBOM Auto-Deploy (Dynamic Firewall)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: "rg-scaowaspdeptrack-qa-eastus2"
  AZURE_NSG_NAME: "vm-scaowaspdeptrack-qa-eastus2-nsg"
  DEPENDENCY_TRACK_HOST: "https://dtrack-indigotech.eastus2.cloudapp.azure.com"
  PROJECT_NAME: "Indira Viewer"

jobs:
  sbom-process:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # --- AQUÍ ESTÁ EL ARREGLO ---
      - name: Open Firewall Rule
        uses: azure/CLI@v1
        with:
          inlineScript: |
            IP=$(curl -s https://api.ipify.org)
            echo "Runner IP: $IP"
            
            # 1. Crear la regla
            az network nsg rule create \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --nsg-name ${{ env.AZURE_NSG_NAME }} \
              --name AllowGitHubRunner-${{ github.run_id }} \
              --priority 1000 \
              --source-address-prefixes $IP \
              --destination-port-ranges 443 \
              --access Allow \
              --protocol Tcp \
              --description "Acceso temporal GitHub Run ${{ github.run_id }}"
            
            # 2. ESPERAR A AZURE (La cura para el error)
            echo "Regla creada. Esperando 60 segundos para propagación..."
            sleep 60

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Generate SBOM
        run: |
          npm install -g @cyclonedx/cdxgen
          cdxgen . -o bom.xml --project-name "${{ env.PROJECT_NAME }}"
          ls -lh bom.xml

      - name: Upload Report
        run: |
          echo "Enviando a ${{ env.DEPENDENCY_TRACK_HOST }}..."
          # Agregamos --verbose (-v) para ver más detalles si falla
          curl -v -X POST "${{ env.DEPENDENCY_TRACK_HOST }}/api/v1/bom" \
            -H "Content-Type: multipart/form-data" \
            -H "X-Api-Key: ${{ secrets.DTRACK_KEY }}" \
            -F "autoCreate=true" \
            -F "projectName=${{ env.PROJECT_NAME }}" \
            -F "projectVersion=${{ github.sha }}" \
            -F "bom=@bom.xml"

      - name: Close Firewall Rule
        if: always()
        uses: azure/CLI@v1
        with:
          inlineScript: |
            echo "Cerrando acceso..."
            az network nsg rule delete \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --nsg-name ${{ env.AZURE_NSG_NAME }} \
              --name AllowGitHubRunner-${{ github.run_id }}
