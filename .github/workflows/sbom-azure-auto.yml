name: SBOM Scalable Security Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
    # ONLY EXECUTES WHEN AFFECTED THESE FILES (DEPS)
    paths:
      - '**/package.json'       # Node.js
      - '**/package-lock.json'  # Node.js
      - '**/pom.xml'            # Java
      - '**/requirements.txt'   # Python
      - '**/*.csproj'           # .NET
      - '.github/workflows/**'  # YAML
  
  workflow_dispatch: # Botón manual (siempre útil)

env:
  AZURE_RESOURCE_GROUP: "rg-scaowaspdeptrack-qa-eastus2"
  AZURE_NSG_NAME: "vm-scaowaspdeptrack-qa-eastus2-nsg"
  DEPENDENCY_TRACK_HOST: "https://dtrack-indigotech.eastus2.cloudapp.azure.com"
  
  PROJECT_NAME: "Indira Viewer"
  
  # ESCALABILITY CONFIGURATION 
  # Usa "WEB" si es SaaS/Web (Sobrescribe Prod). 
  # Usa "DESKTOP" si es instalable (Guarda historial v1, v2...).
  APP_TYPE: "WEB" 

jobs:
  sbom-process:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # --- 🧠 LÓGICA DE VERSIONADO INTELIGENTE ---
      - name: Determine Project Version
        id: versioning
        run: |
          # CASO 1: Desarrollo Diario (Ramas main/master)
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "Modo detectado: DESARROLLO CONTINUO"
            echo "DT_VERSION=main" >> $GITHUB_ENV
          
          # CASO 2: Lanzamiento Oficial (Tags)
          elif [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "Modo detectado: RELEASE OFICIAL CON TAG ($TAG_NAME)"
            
            # Asignamos directamente el nombre del tag (ej: v1.0.0) como versión.
            # Dependency-Track creará una versión nueva para cada tag distinto.
            echo "DT_VERSION=$TAG_NAME" >> $GITHUB_ENV
          
          # CASO 3: Fallback (Cualquier otra rama)
          else
            echo "Modo detectado: EXPERIMENTAL"
            echo "DT_VERSION=experimental-${{ github.sha }}" >> $GITHUB_ENV
          fi

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Open Firewall Rule
        uses: azure/CLI@v1
        with:
          inlineScript: |
            IP=$(curl -s https://api.ipify.org)
            echo "Runner IP: $IP"
            
            # 1. Crear la regla
            az network nsg rule create \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --nsg-name ${{ env.AZURE_NSG_NAME }} \
              --name AllowGitHubRunner-${{ github.run_id }} \
              --priority 1000 \
              --source-address-prefixes $IP \
              --destination-port-ranges 443 \
              --access Allow \
              --protocol Tcp \
              --description "Acceso temporal GitHub Run ${{ github.run_id }}"
            
            # 2. ESPERAR A AZURE (Crítico para evitar Timeout)
            echo "Regla creada. Esperando 60 segundos para propagación..."
            sleep 60

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Generate SBOM
        run: |
          npm install -g @cyclonedx/cdxgen
          cdxgen . -o bom.xml --project-name "${{ env.PROJECT_NAME }}"
          ls -lh bom.xml

      - name: Upload Report
        run: |
          echo "Subiendo a Proyecto: ${{ env.PROJECT_NAME }} - Versión: ${{ env.DT_VERSION }}"
          
          curl -v -X POST "${{ env.DEPENDENCY_TRACK_HOST }}/api/v1/bom" \
            -H "Content-Type: multipart/form-data" \
            -H "X-Api-Key: ${{ secrets.DTRACK_KEY }}" \
            -F "autoCreate=true" \
            -F "projectName=${{ env.PROJECT_NAME }}" \
            -F "projectVersion=${{ env.DT_VERSION }}" \
            -F "bom=@bom.xml"

      - name: Close Firewall Rule
        if: always()
        uses: azure/CLI@v1
        with:
          inlineScript: |
            echo "Cerrando acceso..."
            az network nsg rule delete \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --nsg-name ${{ env.AZURE_NSG_NAME }} \
              --name AllowGitHubRunner-${{ github.run_id }}
