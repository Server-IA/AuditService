name: Universal Security Pipeline

on:
  push:
    branches: [ "main" ]       # Carril 2 (Espejo)
    tags: [ "v*" ]             # Carril 3 (Producción)
  pull_request:
    branches: [ "main" ]       # Carril 1 (Filtro)

env:
  # --- CONFIGURACIÓN BASE ---
  AZURE_RESOURCE_GROUP: "rg-scaowaspdeptrack-qa-eastus2"
  AZURE_NSG_NAME: "vm-scaowaspdeptrack-qa-eastus2-nsg"
  DEPENDENCY_TRACK_HOST: "https://dtrack-indigotech.eastus2.cloudapp.azure.com"
  
  # DEFINIR TIPO DE APP: Cambia a "WEB" o "DESKTOP" según el repo
  APP_TYPE: "WEB" 
  PROJECT_NAME: "Indira Viewer"

jobs:
  security-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 🧠 EL CEREBRO: Decide el nombre de la versión automáticamente
      - name: Determine Version Logic
        run: |
          # CASO 1: Es un Pull Request (Carril 1)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Modo: PREVENCIÓN"
            echo "DT_VERSION=CI-Check-${{ github.head_ref }}" >> $GITHUB_ENV
            echo "AUTO_CREATE=false" >> $GITHUB_ENV # Opcional: No crear proyecto si no existe

          # CASO 2: Es la rama Main (Carril 2)
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Modo: ESPEJO (Main)"
            echo "DT_VERSION=main" >> $GITHUB_ENV
            echo "AUTO_CREATE=true" >> $GITHUB_ENV

          # CASO 3: Es un Tag/Release (Carril 3)
          elif [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "Modo: PRODUCCIÓN detectado. Tipo de App: ${{ env.APP_TYPE }}"
            
            if [[ "${{ env.APP_TYPE }}" == "WEB" ]]; then
               # Si es Web, siempre se llama "Production" (Sobrescribe)
               echo "DT_VERSION=Production" >> $GITHUB_ENV
            else
               # Si es Escritorio, usa el nombre del tag (v1.0, v2.0...)
               echo "DT_VERSION=$TAG_NAME" >> $GITHUB_ENV
            fi
            echo "AUTO_CREATE=true" >> $GITHUB_ENV
          fi

      # ... (Aquí irían tus pasos de Azure Login, Firewall Open y Setup Node) ...

      - name: Generate SBOM
        run: |
          npm install -g @cyclonedx/cdxgen
          cdxgen . -o bom.xml --project-name "${{ env.PROJECT_NAME }}"

      - name: Upload to Dependency-Track
        run: |
          echo "Subiendo a Proyecto: ${{ env.PROJECT_NAME }} - Versión: ${{ env.DT_VERSION }}"
          curl -X POST "${{ env.DEPENDENCY_TRACK_HOST }}/api/v1/bom" \
            -H "Content-Type: multipart/form-data" \
            -H "X-Api-Key: ${{ secrets.DTRACK_KEY }}" \
            -F "autoCreate=${{ env.AUTO_CREATE }}" \
            -F "projectName=${{ env.PROJECT_NAME }}" \
            -F "projectVersion=${{ env.DT_VERSION }}" \
            -F "bom=@bom.xml"

      # 7. Cerrar Firewall (Se ejecuta SIEMPRE
      - name: Close Firewall Rule
        if: always()
        uses: azure/CLI@v1
        with:
          inlineScript: |
            echo "Cerrando acceso..."
            az network nsg rule delete \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --nsg-name ${{ env.AZURE_NSG_NAME }} \
              --name AllowGitHubRunner-${{ github.run_id }}
